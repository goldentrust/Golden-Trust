<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - Golden Trust</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #070707;
            color: #fff;
            font-family: Arial, sans-serif;
            padding-bottom: 100px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 18px;
        }

        .logo {
            color: #d4af37;
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .profile {
            text-decoration: none;
            color: #d4af37;
            text-align: center;
        }

        .profile-icon {
            width: 43px;
            height: 43px;
            border: 1px solid #d4af37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-name {
            font-size: 10px;
            margin-top: 4px;
        }

        .title {
            padding: 15px 18px 22px;
        }

        .title h1 {
            font-size: 29px;
            margin-bottom: 7px;
        }

        .title p {
            color: #777;
            font-size: 12px;
        }

        .filters {
            display: flex;
            gap: 8px;
            padding: 0 18px 20px;
            overflow-x: auto;
        }

        .filter {
            padding: 10px 17px;
            border-radius: 20px;
            border: 1px solid #303030;
            background: #111;
            color: #777;
            white-space: nowrap;
            font-size: 11px;
            cursor: pointer;
        }

        .filter.active {
            color: #d4af37;
            border-color: #d4af37;
            background: #18150b;
        }

        .transaction {
            margin: 0 18px 11px;
            padding: 17px;
            border-radius: 17px;
            background: #121212;
            border: 1px solid #282828;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid #d4af37;
            color: #d4af37;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
        }

        .name {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .date {
            color: #666;
            font-size: 10px;
        }

        .right {
            text-align: right;
        }

        .amount {
            color: #45d18a;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .status {
            color: #45d18a;
            font-size: 9px;
        }

        .empty {
            margin: 20px 18px;
            padding: 35px 20px;
            text-align: center;
            border-radius: 18px;
            background: #101010;
            border: 1px solid #252525;
        }

        .empty-icon {
            font-size: 35px;
            color: #444;
            margin-bottom: 12px;
        }

        .empty-title {
            font-size: 14px;
            margin-bottom: 6px;
        }

        .empty-text {
            color: #666;
            font-size: 11px;
            line-height: 1.6;
        }

        .back {
            display: block;
            margin: 22px 18px;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 13px;
            color: #d4af37;
            text-align: center;
            text-decoration: none;
            font-size: 12px;
        }

        .bottom {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 80px;
            background: rgba(10,10,10,.98);
            border-top: 1px solid #252525;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav {
            color: #666;
            text-decoration: none;
            text-align: center;
            font-size: 10px;
        }

        .nav-icon {
            display: block;
            font-size: 21px;
            margin-bottom: 5px;
        }

        .nav.active {
            color: #d4af37;
        }
    </style>
</head>

<body>

    <div class="top">

        <div class="logo">
            GOLDEN TRUST
        </div>

        <a href="/login" class="profile">

            <div class="profile-icon">
                👤
            </div>

            <div class="profile-name">
                Profile
            </div>

        </a>

    </div>


    <div class="title">

        <h1>
            Transactions
        </h1>

        <p>
            View your account activity
        </p>

    </div>


    <div class="filters">

        <button class="filter active">
            All
        </button>

        <button class="filter">
            Deposits
        </button>

        <button class="filter">
            Income
        </button>

        <button class="filter">
            Withdrawals
        </button>

    </div>


    <div class="empty">

        <div class="empty-icon">
            ◷
        </div>

        <div class="empty-title">
            No transactions yet
        </div>

        <div class="empty-text">
            Your account activity will appear here.
        </div>

    </div>


    <a href="/dashboard" class="back">
        Back to Dashboard
    </a>


    <div class="bottom">

        <a href="/" class="nav">
            <span class="nav-icon">⌂</span>
            Home
        </a>

        <a href="/team" class="nav">
            <span class="nav-icon">♧</span>
            Team
        </a>

        <a href="/plans" class="nav">
            <span class="nav-icon">◈</span>
            Plans
        </a>

        <a href="#" class="nav">
            <span class="nav-icon">★</span>
            Earn
        </a>

        <a href="/dashboard" class="nav active">
            <span class="nav-icon">▣</span>
            Dashboard
        </a>

    </div>

</body>
</html>
